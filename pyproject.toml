[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-layer-mad"
version = "0.1.0"
description = "Dual-Layer Median Absolute Deviation (MAD) noise estimation algorithm immune to step-edges and trajectory turning points."
readme = "README.md"
authors = [
    { name = "minicom365" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0"
]
keywords = ["mad", "noise-estimation", "signal-processing", "robust-statistics", "kalman-filter", "outlier-rejection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/minicom365/dual-layer-mad"
Repository = "https://github.com/minicom365/dual-layer-mad.git"
